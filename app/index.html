<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101612" />
    <title>Parti Pris — Villa Abdo</title>
    <meta
      name="description"
      content="An interactive single-file rebuild of the Parti Pris villa model."
    />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>Parti Pris</span>
        </div>
        <div class="topbar-meta">
          <span class="pill">model v2</span>
          <span class="meta-separator" aria-hidden="true"></span>
          <span>single file · no network</span>
        </div>
      </header>

      <main class="stage" id="stage">
        <div class="loading" id="loading">
          <span class="loading-line" aria-hidden="true"></span>
          <span>Building the house…</span>
        </div>

        <section class="hud" aria-labelledby="villa-title">
          <p class="eyebrow">Reference model / rebuild</p>
          <h1 id="villa-title">Villa Abdo</h1>
          <p class="lede">
            Three floors cut from the canonical wall graph.
          </p>
          <dl class="stats">
            <div>
              <dt>Floors</dt>
              <dd data-stat="floors">—</dd>
            </div>
            <div>
              <dt>Walls</dt>
              <dd data-stat="walls">—</dd>
            </div>
            <div>
              <dt>Openings</dt>
              <dd data-stat="openings">—</dd>
            </div>
          </dl>
          <p class="status" id="status" role="status" aria-live="polite">
            Loading model…
          </p>
        </section>

        <p class="hint">Drag to orbit <span aria-hidden="true">·</span> Scroll to zoom</p>
        <p class="stamp">M3 · villa builder</p>
      </main>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
